# ─────────────────────────────────────────────────────────────────────────────
# Shared configuration anchor (applied to all iKalibr services)
# ─────────────────────────────────────────────────────────────────────────────
x-ikalibr-base: &ikalibr-base
  user: "fruc-docker"
  build:
    context: .
    dockerfile: Dockerfile
    args:
      LOCAL_UID: ${LOCAL_UID:-${FRUC_UID:-1000}}
      LOCAL_GID: ${LOCAL_GID:-${FRUC_GID:-1000}}
      IKALIBR_REBUILD_CUDA: ${IKALIBR_REBUILD_CUDA:-0}
      IKALIBR_REBUILD_SFM_CUDA: ${IKALIBR_REBUILD_SFM_CUDA:-0}
      IKALIBR_REBUILD_SRC: ${IKALIBR_REBUILD_SRC:-0}
      IKALIBR_GIT_REF: ${IKALIBR_GIT_REF:-master}
      CERES_GIT_REF: ${CERES_GIT_REF:-2.2.0}
      COLMAP_GIT_REF: ${COLMAP_GIT_REF:-3.13.0}
      GLOMAP_GIT_REF: ${GLOMAP_GIT_REF:-1.2.0}
      POSELIB_GIT_REF: ${POSELIB_GIT_REF:-master}
      COLMAP_CUDA_ARCHITECTURES: ${COLMAP_CUDA_ARCHITECTURES:-all-major}
      IKALIBR_BUILD_GLOMAP: ${IKALIBR_BUILD_GLOMAP:-0}
  image: ${IKALIBR_IMAGE:-fruc-ikalibr:latest}
  environment:
    USER: fruc-docker
    LOGNAME: fruc-docker
    DISPLAY: ${DISPLAY:-:0}
    XDG_RUNTIME_DIR: /tmp
    QT_X11_NO_MITSHM: "1"
    HOME: /home/fruc-docker
    XAUTHORITY: /tmp/fruc.xauth
  volumes:
    # X11 display forwarding
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY_PATH:-/tmp/fruc-docker-empty.xauth}:/tmp/fruc.xauth:rw
    # Your dataset bags (read-only inside container at /bags)
    - ${BAGS_PATH:-/tmp}:/bags:ro
    # Your Docker-adapted config files (editable)
    - ./config:/workspace/config:rw
    # Calibration results land here on the host
    - ./output:/workspace/output:rw
  devices:
    # GPU/DRI for the 3D viewer; comment out if not available
    - /dev/dri:/dev/dri
  network_mode: host
  # Run ../apply_compose_memory_limits.sh to generate a host-specific .env.
  # These fallbacks keep the stack usable if no .env has been generated yet.
  mem_limit: ${IKALIBR_MEM_LIMIT:-16g}
  memswap_limit: ${IKALIBR_MEMSWAP_LIMIT:-16g}
  # Source the catkin workspace before every command
  entrypoint: ["/bin/bash", "-c"]

x-ikalibr-nvidia: &ikalibr-nvidia
  gpus: all
  environment:
    USER: fruc-docker
    LOGNAME: fruc-docker
    DISPLAY: ${DISPLAY:-:0}
    XDG_RUNTIME_DIR: /tmp
    QT_X11_NO_MITSHM: "1"
    HOME: /home/fruc-docker
    XAUTHORITY: /tmp/fruc.xauth
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,graphics}

# ─────────────────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ---------------------------------------------------------------------------
  # Main spatiotemporal calibration solver
  # Usage:  docker compose run --rm solver
  # ---------------------------------------------------------------------------
  solver:
    <<: *ikalibr-base
    container_name: ikalibr-solver
    command:
      - >
        source /home/iKalibr/install/setup.bash &&
        roslaunch ikalibr ikalibr-prog.launch
        config_path:=/workspace/config/ikalibr-config.yaml

  # ---------------------------------------------------------------------------
  # GPU solver (optional): uses NVIDIA runtime when available
  # Usage: docker compose run --rm solver-cuda
  # ---------------------------------------------------------------------------
  solver-cuda:
    <<: [*ikalibr-nvidia, *ikalibr-base]
    container_name: ikalibr-solver-cuda
    command:
      - >
        source /home/iKalibr/install/setup.bash &&
        roslaunch ikalibr ikalibr-prog.launch
        config_path:=/workspace/config/ikalibr-config.yaml

  # ---------------------------------------------------------------------------
  # IMU intrinsics calibration (run this before the solver if needed)
  # Usage:  docker compose run --rm imu-calib
  # ---------------------------------------------------------------------------
  imu-calib:
    <<: *ikalibr-base
    container_name: ikalibr-imu-calib
    command:
      - >
        source /home/iKalibr/install/setup.bash &&
        roslaunch ikalibr ikalibr-imu-intri-calib.launch
        config_path:=/workspace/config/tool/config-imu-intri-calib.yaml

  # ---------------------------------------------------------------------------
  # Interactive shell — useful for exploring the container or running any tool
  # Usage:  docker compose run --rm shell
  #   then inside: roslaunch ikalibr ikalibr-bag-merge.launch
  #                roslaunch ikalibr ikalibr-lidar-map-viewer.launch
  #                roslaunch ikalibr ikalibr-data-format-transformer.launch
  # ---------------------------------------------------------------------------
  shell:
    <<: [*ikalibr-nvidia, *ikalibr-base]
    container_name: ikalibr-shell
    stdin_open: true
    tty: true
    # .bashrc now sources /home/iKalibr/install/setup.bash — no --rcfile needed
    entrypoint: ["/bin/bash"]
    command: []

  # ---------------------------------------------------------------------------
  # GPU-accelerated SfM with CUDA-enabled COLMAP.
  # Build the image first (one-time, ~10 min):
  #   docker build --build-arg IKALIBR_REBUILD_SFM_CUDA=1 \
  #                -t fruc-ikalibr-sfm-gpu -f Dockerfile .
  # Usage:  docker compose run --rm sfm-cuda
  # Override image: IKALIBR_SFM_IMAGE=my-image docker compose run --rm sfm-cuda
  # ---------------------------------------------------------------------------
  sfm-cuda:
    <<: *ikalibr-nvidia
    image: ${IKALIBR_SFM_IMAGE:-fruc-ikalibr-sfm-gpu}
    user: "fruc-docker"
    volumes:
      - ./output:/workspace/output:rw
    network_mode: host
    mem_limit: ${IKALIBR_MEM_LIMIT:-16g}
    memswap_limit: ${IKALIBR_MEMSWAP_LIMIT:-16g}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SFM_WS=/workspace/output/ren_inwards/images/camera/color/image_raw/sfm_ws
        IMGS=/workspace/output/ren_inwards/images/camera/color/image_raw/images
        DB="$${SFM_WS}/database.db"
        echo "[sfm-cuda] Removing old database ..."
        rm -f "$${DB}" "$${DB}-shm" "$${DB}-wal"
        echo "[sfm-cuda] 1/4  feature_extractor (GPU)"
        colmap feature_extractor \
          --database_path "$${DB}" \
          --image_path "$${IMGS}" \
          --ImageReader.camera_model PINHOLE \
          --ImageReader.single_camera 1 \
          --ImageReader.camera_params 612.900,613.156,321.519,246.794 \
          --FeatureExtraction.use_gpu 1 \
          --FeatureExtraction.gpu_index 0
        echo "[sfm-cuda] 2/4  matches_importer"
        colmap matches_importer \
          --database_path "$${DB}" \
          --match_list_path "$${SFM_WS}/matches.txt" \
          --match_type pairs
        echo "[sfm-cuda] 3/4  mapper"
        rm -rf "$${SFM_WS}/0"
        colmap mapper \
          --database_path "$${DB}" \
          --image_path "$${IMGS}" \
          --output_path "$${SFM_WS}" \
          --Mapper.init_min_tri_angle 25 \
          --Mapper.init_max_error 1 \
          --Mapper.tri_min_angle 3 \
          --Mapper.ba_refine_focal_length 0 \
          --Mapper.ba_refine_principal_point 0
        echo "[sfm-cuda] 4/4  model_converter"
        colmap model_converter \
          --input_path "$${SFM_WS}/0" \
          --output_path "$${SFM_WS}" \
          --output_type TXT
        echo "[sfm-cuda] SfM complete."
