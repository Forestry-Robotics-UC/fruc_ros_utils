Configor:
  DataStream:
    # ═══════════════════════════════════════════════════════════════════════════
    # Polo2 Apparatus Dataset Configuration
    # ═══════════════════════════════════════════════════════════════════════════
    # Hardware:
    #   - XSens MTi-3 IMU (main reference IMU)
    #   - Ouster OS1 LiDAR with integrated IMU
    #   - Intel RealSense D435i Camera
    #
    # Topics (5-minute chunks):
    #   /imu/data          : XSens IMU @ ~390 Hz (117k msgs per 5min)
    #   /ouster/imu        : Ouster IMU @ ~100 Hz (30k msgs per 5min)
    #   /ouster/points     : Ouster scans @ ~20 Hz (6k scans per 5min)
    #   /camera/color/image_raw : RealSense @ ~30 Hz (9k frames per 5min)
    # ═══════════════════════════════════════════════════════════════════════════

    # ─── IMU Topics ────────────────────────────────────────────────────────────
    IMUTopics:
      - key: "/imu/data"                      # XSens MTi-3 (main reference)
        value:
          Type: "SENSOR_IMU"                  # rad/s + m/s^2
          Intrinsics: "/workspace/config/imu-intri.yaml"
          AcceWeight: 17.68
          GyroWeight: 57.66

    # ─── Radar Topics ──────────────────────────────────────────────────────────
    RadarTopics: []                           # No radar in this setup

    # ─── LiDAR Topics ──────────────────────────────────────────────────────────
    LiDARTopics:
      - key: "/ouster/points"                 # Ouster OS1 decoded scans
        value:
          Type: "OUSTER_POINTS_RING_16"       # ring field is uint16
          Weight: 60.0

    # ─── Camera Topics ─────────────────────────────────────────────────────────
    CameraTopics:
      - key: "/camera/color/image_raw"        # RealSense D435i color
        value:
          Type: "SENSOR_IMAGE_GS"             # Global shutter approximation
          Intrinsics: "/workspace/config/cam_calib.yaml"
          Weight: 50.0
          TrackLengthMin: 10
          ScaleSplineType: LIN_POS_SPLINE

    # ─── RGB-D Camera Topics ───────────────────────────────────────────────────
    RGBDTopics: []
    # Optional: Uncomment to use depth for refined calibration
    # RGBDTopics:
    #  - key: "/camera/color/image_raw"
    #    value:
    #      Type: "SENSOR_IMAGE_GS"
    #      Intrinsics: "/workspace/config/cam-intri-pinhole-brown.yaml"
    #      DepthTopic: "/camera/aligned_depth_to_color/image_raw"
    #      DepthFactor: 0.001              # mm to meters
    #      Weight: 0.1
    #      TrackLengthMin: 5

    # ─── Reference IMU ─────────────────────────────────────────────────────────
    ReferIMU: "/imu/data"                     # XSens as reference frame

    # ─── Bag & Output ──────────────────────────────────────────────────────────
    BagPath: "/bags/output_5m_0.bag"          # Will be updated by script
    BeginTime: 0                               # Start from beginning of chunk
    Duration: -1                               # Use all data in chunk (~5 minutes)

    OutputPath: "/workspace/output/polo2/chunk_0"  # Will be updated by script

  Prior:
    GravityNorm: 9.81
    SpatTempPrioriPath: ""                    # Generated from apparatus URDF
    OptTemporalParams: true
    # Time offset search range (seconds)
    TimeOffsetPadding: 0.10
    # Readout time padding for rolling shutter cameras
    ReadoutTimePadding: 0.01
    # Map voxel size for visualization (outdoor: 0.05, indoor: 0.1)
    MapDownSample: 0.05
    # Memory-safe default: 0.10s = ~3000 knots for 300s chunks
    KnotTimeDist:
      SO3Spline: 0.10                         # 100ms knot spacing for rotation
      ScaleSpline: 0.10
    # NDT LiDAR odometer for rough pose recovery
    NDTLiDAROdometer:
      Resolution: 1.0                         # 1.0 for outdoor case
      KeyFrameDownSample: 0.1
    # LiDAR data association parameters
    LiDARDataAssociate:
      MapDownSample: 0.1                      # 0.1 for outdoor
      PointToSurfelMax: 0.1
      PlanarityMin: 0.6
    
  Preference:
    UseCudaInSolving: false
    Outputs:
      - LiDARMaps
      - VisualMaps
      - VisualLiDARCovisibility
    OutputDataFormat: "YAML"
    ThreadsToUse: 4                           # Limit threads for lower RAM use
    SplineScaleInViewer: 3.0
    CoordSScaleInViewer: 0.3

  # ═══════════════════════════════════════════════════════════════════════════
  # NOTES:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Make sure to run the decoding step first:
  #    docker compose run --rm converter \
  #      --input-bag /rosbags/polo2_sync_test_apparatus \
  #      --output-bag /rosbags/output_5m \
  #      --max-bagfile-duration 300s --skip-original-topics
  #
  # 2. Convert MCAPs → ROS1 bags before running iKalibr
  #
  # 3. Generate spatial-temporal priors from apparatus URDF with:
  #    python3 urdf_to_ikalibr_priori.py \
  #      --urdf apparatus/.../robot.urdf.xacro \
  #      --map "/imu/data:xsens_imu" "/ouster/points:os_lidar" \
  #            "/camera/color/image_raw:camera_color_optical_frame" \
  #      --ref "/imu/data"
  # ═══════════════════════════════════════════════════════════════════════════
