Configor:
  # IMU topic and type — must match what is in your bag
  IMUTopic: /imu0/frame       # <-- change to your IMU topic
  IMUType: SENSOR_IMU         # <-- change to match your IMU driver

  GravityNorm: 9.81           # <-- set for your location

  # Results saved to /workspace/output/ inside the container (./docker/output/ on host)
  OutputPath: /workspace/output/imu-intri

  # ─── Bags for static calibration ────────────────────────────────────────────
  # Collect several stationary bags with the IMU in different orientations
  # (e.g. X-up, X-down, Y-up, Y-down, Z-up, Z-down — six-position method).
  # All bags are accessed at /bags/<filename> inside the container.
  # Set 'first: -1 / second: -1' to use the entire bag.
  ROSBags:
    - BagPath: /bags/imu_x_down.bag   # <-- change / duplicate as needed
      StaticPieces:
        - first: -1
          second: -1
    - BagPath: /bags/imu_x_up.bag
      StaticPieces:
        - first: -1
          second: -1
    - BagPath: /bags/imu_y_down.bag
      StaticPieces:
        - first: -1
          second: -1
    - BagPath: /bags/imu_y_up.bag
      StaticPieces:
        - first: -1
          second: -1
    - BagPath: /bags/imu_z_down.bag
      StaticPieces:
        - first: -1
          second: -1
    - BagPath: /bags/imu_z_up.bag
      StaticPieces:
        - first: -1
          second: -1
