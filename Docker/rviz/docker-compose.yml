x-rviz-common: &rviz-common
  user: "fruc-docker"
  environment:
    - USER=fruc-docker
    - LOGNAME=fruc-docker
    - DISPLAY=${DISPLAY:-:0}
    - XDG_RUNTIME_DIR=/tmp/rviz-runtime
    - LIBGL_ALWAYS_SOFTWARE=1
    - QT_QPA_PLATFORM=xcb
    - QT_X11_NO_MITSHM=1
    - HOME=/home/fruc-docker
    - XAUTHORITY=/tmp/fruc.xauth
  volumes:
    - ${BAGS_PATH:-.}:/bags:ro
    - ./config:/config:rw
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-${HOME:-/root}/.Xauthority}:/tmp/fruc.xauth:ro
  network_mode: host
  stdin_open: true
  tty: true

services:
  ros2:
    <<: *rviz-common
    build:
      context: .
      dockerfile: Dockerfile.jazzy
      args:
        LOCAL_UID: ${LOCAL_UID:-${FRUC_UID:-1000}}
        LOCAL_GID: ${LOCAL_GID:-${FRUC_GID:-1000}}
    image: fruc-rviz:jazzy
    container_name: fruc-ros2-rviz
    profiles: ["ros2"]
    command: >
      bash -lc "
      set -e;
      mkdir -p /tmp/rviz-runtime && chmod 0700 /tmp/rviz-runtime;
      source /opt/ros/jazzy/setup.bash;
      if [ -z \"${ROS2_BAG:-}\" ]; then
        echo \"ROS2_BAG is not set. Export ROS2_BAG to the ROS2 filename under /bags\" && exit 1;
      fi;
      if [ ! -f /bags/${ROS2_BAG} ]; then
        echo \"ROS2_BAG not found in /bags: /bags/${ROS2_BAG}\" && exit 1;
      fi;
      ros2 bag play /bags/${ROS2_BAG} --clock --rate ${BAG_PLAY_RATE:-1.0} >/tmp/ros2_bag_play.log 2>&1 &
      rviz2 -d \"${RVIZ_CONFIG:-/config/ros2_frc_dataset.rviz}\";
      "

  ros1:
    <<: *rviz-common
    build:
      context: .
      dockerfile: Dockerfile.noetic
      args:
        LOCAL_UID: ${LOCAL_UID:-${FRUC_UID:-1000}}
        LOCAL_GID: ${LOCAL_GID:-${FRUC_GID:-1000}}
    image: fruc-rviz:noetic
    container_name: fruc-ros1-rviz
    profiles: ["ros1"]
    command: >
      bash -lc "
      set -e;
      mkdir -p /tmp/rviz-runtime && chmod 0700 /tmp/rviz-runtime;
      source /opt/ros/noetic/setup.bash;
      roscore >/tmp/roscore.log 2>&1 &
      for _ in $(seq 1 30); do
        if rostopic list >/dev/null 2>&1; then
          break;
        fi;
        sleep 0.5;
      done;
      if ! rostopic list >/dev/null 2>&1; then
        echo \"Failed to start ROS1 master (roscore). Check /tmp/roscore.log\" && exit 1;
      fi;
      if [ -z \"${ROS1_BAG:-}\" ]; then
        echo \"ROS1_BAG is not set. Export ROS1_BAG to the ROS1 filename under /bags\" && exit 1;
      fi;
      if [ ! -f /bags/${ROS1_BAG} ]; then
        echo \"ROS1_BAG not found in /bags: /bags/${ROS1_BAG}\" && exit 1;
      fi;
      if [ -n \"${ROS1_TOPICS:-}\" ]; then
        rosbag play /bags/${ROS1_BAG} --clock -r ${BAG_PLAY_RATE:-1.0} --topics ${ROS1_TOPICS} >/tmp/ros1_bag_play.log 2>&1 &
      else
        rosbag play /bags/${ROS1_BAG} --clock -r ${BAG_PLAY_RATE:-1.0} >/tmp/ros1_bag_play.log 2>&1 &
      fi;
      rviz -d \"${RVIZ_CONFIG:-/config/ros1_frc_dataset.rviz}\";
      "
