networks:
  ros2-net:
    driver: bridge

x-packet-common: &packet-common
  user: "fruc-docker"
  stdin_open: true
  tty: true
  privileged: true
  # Run ../apply_compose_memory_limits.sh to generate a host-specific .env.
  # These fallbacks keep the stack usable if no .env has been generated yet.
  mem_limit: ${PACKET_CONVERTER_MEM_LIMIT:-8g}
  memswap_limit: ${PACKET_CONVERTER_MEMSWAP_LIMIT:-8g}

services:
  # Base image - foundation for other services
  # base:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.base
  #     target: base
  #     args:
  #       ROS_DISTRO: jazzy
  #   image: ros2-apparatus-base:jazzy
  #   container_name: ros2-apparatus-base

  converter:
    <<: *packet-common
    build:
      context: .
      dockerfile: Dockerfile.converter
      args:
        LOCAL_UID: ${LOCAL_UID:-${FRUC_UID:-1000}}
        LOCAL_GID: ${LOCAL_GID:-${FRUC_GID:-1000}}
    image: ros2-apparatus-converter:jazzy
    container_name: ros2-packet-converter
    networks:
      - ros2-net
    volumes:
      - /mnt/phd/datasets/curt_test_calib/jazzy_no_post/:/rosbags  # Place your .mcap or .bag files here
      - ./scripts:/app/scripts  # Place your conversion scripts here
    environment:
      - PYTHONUNBUFFERED=1
      - USER=fruc-docker
      - LOGNAME=fruc-docker
      - HOME=/home/fruc-docker
    # Use the entrypoint script; pass any script args via the SCRIPT_ARGS environment variable
    command: ${SCRIPT_ARGS:-}

    # rqt_bag service with x11 forwarding for GUI
  rqt_bag:
    <<: *packet-common
    build:
      context: .
      dockerfile: Dockerfile.rqt_bag
      args:
        LOCAL_UID: ${LOCAL_UID:-${FRUC_UID:-1000}}
        LOCAL_GID: ${LOCAL_GID:-${FRUC_GID:-1000}}
    image: ros2-apparatus-rqt-bag:jazzy
    container_name: ros2-rqt-bag
    networks:
      - ros2-net
    environment:
      - PYTHONUNBUFFERED=1
      - USER=fruc-docker
      - LOGNAME=fruc-docker
      - HOME=/home/fruc-docker
      - DISPLAY=${DISPLAY}  # Forward the display for GUI
      - XAUTHORITY=/tmp/fruc.xauth
      - QT_X11_NO_MITSHM=1  # Disable MIT-SHM for X11 forwarding
    volumes:
      - ./rosbags:/rosbags  # Access the same .mcap or .bag files
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket for GUI
      - ${XAUTHORITY:-${HOME:-/root}/.Xauthority}:/tmp/fruc.xauth:ro
    command: rqt_bag  # Start rqt_bag directly  
