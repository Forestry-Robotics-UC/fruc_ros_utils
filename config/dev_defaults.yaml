# ----------------- DEV CONFIG -----------------

illumination:
  # WB + CLAHE
  white_balance: true
  clahe_clip_limit: 2.8
  clahe_tiles: 8

  # Targets for gamma correction
  target_mean_under: 135.0
  target_mean_over: 140.0

  mean_dark: 95.0        # was 85
  mean_bright: 165.0     # was 170
  pct_dark_th: 5.0       # was 25
  pct_bright_th: 15.0    # was 20
  dyn_range_min: 210.0   # was 60

  # Gamma clamps
  gamma_min: 0.6
  gamma_max: 1.8

  # RAW path options
  raw_enable_clahe: false
  raw_p_low: 1.0
  raw_p_high: 99.0
  raw_gamma_strength: 0.7
  raw_target_mean_under: 135.0
  raw_target_mean_over: 120.0
  raw_gamma_min: 0.75
  raw_gamma_max: 1.35

  # Egomotion
  ego_theta_thresh_rad: 0.0025

  # Deblur
  deblur_enabled: true
  deblur_mode: "multiframe"   # "single" | "multiframe" | "off"
  deblur_algorithm: "lucy"    # "lucy" | "wiener"
  deblur_iters: 15
  deblur_wiener_k: 0.01
  deblur_psf_max_px: 25.0
  deblur_psf_min_px: 2.0

  # Multi-frame fusion
  mf_window: 3
  mf_align: "flow"            # "flow" | "ego"
  mf_sharpness_metric: "laplacian"
  mf_sigma: 1.0
  mf_min_sharpness: 75.0 # was 50

image_utils:
  # Retinex / LIME
  retinex_scales: [15, 80, 250]
  lime_guided_radius: 15
  lime_guided_eps: 0.001

  # Motion kernel
  motion_kernel_width: 0.8

metrics:
  # Sharpness
  sharpness_metric: "laplacian"   # laplacian | sobel
  sobel_ksize: 3
  laplacian_ksize: 3

bagutils:
  # Runtime options
  preserve_bayer: true
  exposure_time: 0.01
  force: false
